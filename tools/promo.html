<!doctype html>
<!--
  Vorlage für die Vorschaubilder.

  ACHTUNG, seit 30.07.2026 nicht mehr die maßgebliche Quelle: assets/og.png und
  assets/instagram.png werden inzwischen zentral gebaut, aus
  dennismit2n.github.io/tools/promo/ (marke.mjs + make-bilder.mjs), zusammen mit
  den Bildern aller Schwesterprojekte und den Formaten für Story, LinkedIn, X und
  Twitch. Wer HIER etwas ändert und danach den zentralen Generator laufen lässt,
  verliert die Änderung wieder. Diese Datei bleibt als Vorläufer erhalten — hier
  ist der dunkle Familien-Entwurf entstanden.

  Wird von tools/make-promo.mjs mit Playwright zu PNG gerendert. Bewusst als
  eingecheckte Vorlage statt als fertige Grafik: So lässt sich das Bild
  nachbauen, wenn sich Farbe, Name oder Untertitel ändern — und es benutzt
  dieselben Farbwerte wie die Startseite.

  Farben nachgeschlagen in dennismit2n.github.io/css/style.css:
    --wifi (dunkel) #22d3ee   Toolfarbe; die helle Variante #0e7490 wäre auf
                              dem dunklen Grund zu leise
    --bg   (dunkel) #0D1226
    --text (dunkel) #E6E9F7
    --text-soft     #A29CCB

  Bewusst ohne Farbverlauf: Die Vorlage der Startseite ist eine flache Fläche
  und wiegt 18 KB. Ein Schein im Hintergrund kostet in PNG das Zehnfache,
  ohne dass es in einer Chat-Vorschau jemandem auffällt.

  Zwei Formate:
    og   1200×630  — Vorschaukarte in Messengern und sozialen Netzen
    ig   1080×1080 — quadratisch für Instagram
-->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0d1226; }

      .karte {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0d1226;
        color: #e6e9f7;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        text-align: center;
        overflow: hidden;
      }
      .karte.og { width: 1200px; height: 630px; }
      .karte.ig { width: 1080px; height: 1080px; }

      .inhalt { position: relative; display: flex; flex-direction: column; align-items: center; }

      .marke { display: block; }
      .og .marke { width: 132px; height: 132px; margin-bottom: 44px; }
      .ig .marke { width: 176px; height: 176px; margin-bottom: 58px; }

      .name { font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
      .og .name { font-size: 80px; }
      .ig .name { font-size: 96px; }

      .frage { color: #22d3ee; font-weight: 600; letter-spacing: -0.01em; }
      .og .frage { font-size: 40px; margin-top: 26px; }
      .ig .frage { font-size: 50px; margin-top: 34px; }

      .en { color: #a29ccb; font-weight: 400; }
      .og .en { font-size: 26px; margin-top: 10px; }
      .ig .en { font-size: 32px; margin-top: 14px; }

      .versprechen {
        color: #a29ccb;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .og .versprechen { font-size: 25px; margin-top: 46px; }
      .ig .versprechen { font-size: 31px; margin-top: 62px; }
      .versprechen b { color: #e6e9f7; font-weight: 600; }
      .punkt { color: #263056; }

      /* Derselbe Farbstreifen wie auf der Startseite, nur mit dem Türkis vorn. */
      .streifen { position: absolute; display: flex; border-radius: 99px; overflow: hidden; }
      .og .streifen { bottom: 52px; width: 260px; height: 7px; }
      .ig .streifen { bottom: 84px; width: 300px; height: 8px; }
      .streifen span { height: 100%; }
      .s1 { background: #22d3ee; flex: 3; }
      .s2 { background: #8fd3f4; flex: 2; }
      .s3 { background: #a29ccb; flex: 2; }
    </style>
  </head>
  <body>
    <div class="karte og" id="og">
      <div class="inhalt">
        <!-- Symbol wie assets/wifi-qr.svg der Startseite, nur in der dunklen Toolfarbe,
             damit es auf dem dunklen Grund trägt. -->
        <svg class="marke" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="2" y="2" width="44" height="44" rx="11" fill="#22d3ee" />
          <g fill="none" stroke="#0d1226" stroke-width="3.4" stroke-linecap="round">
            <path d="M12 21.5c6.6-6 17.4-6 24 0" />
            <path d="M16.5 27.5c4.2-3.8 10.8-3.8 15 0" />
          </g>
          <circle cx="24" cy="34" r="2.6" fill="#0d1226" />
        </svg>
        <div class="name">WLAN-QR-Karte</div>
        <div class="frage">Gäste scannen – und sind im WLAN.</div>
        <div class="en">WiFi QR Card — guests scan and they're in.</div>
        <div class="versprechen">
          <span><b>Kostenlos</b></span><span class="punkt">·</span>
          <span><b>ohne Anmeldung</b></span><span class="punkt">·</span>
          <span><b>ohne Upload</b></span>
        </div>
      </div>
      <div class="streifen"><span class="s1"></span><span class="s2"></span><span class="s3"></span></div>
    </div>

    <div class="karte ig" id="ig">
      <div class="inhalt">
        <svg class="marke" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="2" y="2" width="44" height="44" rx="11" fill="#22d3ee" />
          <g fill="none" stroke="#0d1226" stroke-width="3.4" stroke-linecap="round">
            <path d="M12 21.5c6.6-6 17.4-6 24 0" />
            <path d="M16.5 27.5c4.2-3.8 10.8-3.8 15 0" />
          </g>
          <circle cx="24" cy="34" r="2.6" fill="#0d1226" />
        </svg>
        <div class="name">WLAN-QR-Karte</div>
        <div class="frage">Gäste scannen – und sind im WLAN.</div>
        <div class="en">WiFi QR Card — guests scan and they're in.</div>
        <div class="versprechen">
          <span><b>Kostenlos</b></span><span class="punkt">·</span>
          <span><b>ohne Anmeldung</b></span><span class="punkt">·</span>
          <span><b>ohne Upload</b></span>
        </div>
      </div>
      <div class="streifen"><span class="s1"></span><span class="s2"></span><span class="s3"></span></div>
    </div>
  </body>
</html>
